<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050" role="img" aria-labelledby="title desc">
  <title id="title">Recorded Photosynthesis workflow</title>
  <desc id="desc">One technical walkthrough, not a learner study. Bilingual initial support is followed by another example at round one and conceptual clarification at round two. The browser then offers no further response choices. Separate API-only cap and High fade checks preserve round two without generation or completion. A scoped follow-up and History, Resume, Finish and Review follow. A final API-only response after completion is rejected without changing stored state. Solid boxes identify browser actions and support. Dashed boxes identify API-only checks. Content remains provisional. Detailed observations are reported in Appendix G.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1d2d3d;font-size:24px}
      .head{font-size:30px;font-weight:700}
      .sub{font-size:22px;fill:#405466}
      .label{font-size:25px;font-weight:700}
      .box{fill:#f6f8fa;stroke:#405466;stroke-width:1.5;rx:9}
      .api{fill:#fffaf0;stroke:#805c28;stroke-width:1.8;stroke-dasharray:8 5;rx:9}
      .link{fill:none;stroke:#34495e;stroke-width:2.1;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="900" height="1050" fill="white"/>
  <text x="45" y="40" class="head">Recorded Photosynthesis workflow</text>
  <text x="45" y="72" class="sub">One technical scenario. Detailed observations are in Appendix G.</text>

  <rect x="45" y="96" width="810" height="100" class="box"/>
  <text x="65" y="128" class="label">Inquiry and initial support</text>
  <text x="65" y="156">Photosynthesis explained with bilingual support</text>
  <text x="65" y="184">Round 0 · one initial generation call</text>
  <path d="M450 196 V222" class="link"/>

  <rect x="45" y="223" width="810" height="80" class="box"/>
  <text x="65" y="255" class="label">Medium → skip optional help → another example</text>
  <text x="65" y="285">Round 0 → 1 · first adaptation</text>
  <path d="M450 303 V322" class="link"/>

  <rect x="45" y="323" width="810" height="80" class="box"/>
  <text x="65" y="355" class="label">Needs Support → conceptual clarification</text>
  <text x="65" y="385">Round 1 → 2 · revised meaning and scaffold</text>
  <path d="M450 403 V422" class="link"/>

  <rect x="45" y="423" width="810" height="80" class="box"/>
  <text x="65" y="455" class="label">Interface at round 2</text>
  <text x="65" y="485">No further response choices are offered</text>
  <path d="M450 503 V522" class="link"/>

  <rect x="45" y="523" width="810" height="100" class="api"/>
  <text x="65" y="555" class="label">API-only cap and High/fade checks</text>
  <text x="65" y="585">Round remains 2 · no generation</text>
  <text x="65" y="613">Four response events · session remains ongoing</text>
  <path d="M450 623 V642" class="link"/>

  <rect x="45" y="643" width="810" height="100" class="box"/>
  <text x="65" y="675" class="label">Concept-scoped follow-up</text>
  <text x="65" y="705">Sunlight answered · unrelated gravity question rejected</text>
  <text x="65" y="733">One answer stored · round remains 2</text>
  <path d="M450 743 V762" class="link"/>

  <rect x="45" y="763" width="810" height="80" class="box"/>
  <text x="65" y="795" class="label">History → Resume → Finish → Review</text>
  <text x="65" y="825">Completed · two adaptations retained</text>
  <path d="M450 843 V862" class="link"/>

  <rect x="45" y="863" width="810" height="80" class="api"/>
  <text x="65" y="895" class="label">API-only response after completion</text>
  <text x="65" y="925">Rejected · stored session unchanged</text>

  <text x="45" y="980" class="sub">Solid boxes = browser workflow. Dashed boxes = API checks.</text>
  <text x="45" y="1011" class="sub">Technical observation, not a learner study. Content provisional.</text>
</svg>
