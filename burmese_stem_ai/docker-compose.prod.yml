name: burmese_stem_ai_prod

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  init-db:
    build:
      context: .
      target: database-init
    environment:
      DB_URL: mongodb://mongodb:27017/burmesestemai
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DB_URL: mongodb://mongodb:27017/burmesestemai
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env.production}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    depends_on:
      mongodb:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          sleep 6h & wait $$!
          nginx -s reload
        done &
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.deploy/certbot-www:/var/www/certbot:ro
      - ./.deploy/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  certbot:
    # Certbot 5.4+ is required for IP certificates with the webroot plugin.
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 12h & wait $$!
        done
    volumes:
      - ./.deploy/certbot-www:/var/www/certbot
      - ./.deploy/letsencrypt:/etc/letsencrypt
    profiles:
      - tls

volumes:
  mongodb-data:

networks:
  backend:
