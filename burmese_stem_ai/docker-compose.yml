name: burmese_stem_ai

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  init-db:
    build:
      context: .
      target: database-init
    environment:
      DB_URL: mongodb://mongodb:27017/burmesestemai
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DB_URL: mongodb://mongodb:27017/burmesestemai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    networks:
      - app-network

volumes:
  mongodb-data:

networks:
  app-network: